<!DOCTYPE html>
<html lang="ca">

<head>
    <title>Mapa Interactiu de Catalunya Medieval - Demo V2.4</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta content="Mapa interactiu d'edificacions medievals de Catalunya amb OpenStreetMaps i leafletjs" name="description">
    <meta content="Enric Ballo" name="author">
    <link href="favicon.png" rel="shortcut icon"/>

    <!-- facebook tags -->
    <meta content="assets/images/CM.png" property="og:image"/>
    <meta content="auto" property="og:image:width"/>
    <meta content="Mapa interactiu d'edificacions medievals de Catalunya." property="og:description"/>
    <meta content="https://demo.catalunyamedieval.es/omap10/" property="og:url"/>
    <meta content="Mapa Interactiu de Catalunya Medieval" property="og:title"/>

    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Droid+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link href="css/catalunya-omap.css" rel="stylesheet" type="text/css">

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const comarca = params.get('comarca');
            const edificiId = params.get('edificiId');
            if (comarca || edificiId) {
                window.catalunyaOmapConfig = window.catalunyaOmapConfig || {};
                if (comarca) window.catalunyaOmapConfig.comarca = comarca;
                if (edificiId) window.catalunyaOmapConfig.edificiId = edificiId;
            }
        })();
    </script>
</head>

<body class="omap-page">

<header id="site-header">
    <div class="header-inner">
        <div class="header-left">
            <h1 id="title-h1">Catalunya Medieval &middot; Demo v2.4</h1>
            <p id="title-h4">Mapa interactiu d'edificacions medievals &middot;
                <a href="https://www.catalunyamedieval.es/" target="_blank" title="Catalunya Medieval">www.catalunyamedieval.es</a>
            </p>
        </div>
        <div class="header-right">
            <a href="https://www.catalunyamedieval.es/" target="_blank" class="header-logo-link" title="Catalunya Medieval">
                <img src="images/logo/logoCM-red-mini.png" alt="Catalunya Medieval" class="header-logo">
            </a>
        </div>
    </div>
</header>

<div id="omap-filters">
    <label>
        Comarca
        <select id="filter-comarca">
            <option value="">— Totes les comarques —</option>
        </select>
    </label>
    <label>
        Edificació
        <select id="filter-edifici" disabled>
            <option value="">— Selecciona una comarca primer —</option>
        </select>
    </label>
    <button id="filter-clear" type="button">Netejar filtres</button>
    <span id="omap-filters-current"></span>
</div>

<div id="container">

    <div id="omap"></div>

    <div id="secondaryDiv" style="display:none;">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="search-list" placeholder="Cercar monument…" type="search" autocomplete="off">
        </div>
        <div id="list">
            <ul id="map-list"></ul>
        </div>
    </div>

</div>

<script src="js/jquery-3.2.1.min.js" type="text/javascript"></script>
<script src="js/bootstrap.min.js" type="text/javascript"></script>
<script src="js/catalunya-omap.min.js" type="text/javascript"></script>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const comarcaSelect = document.getElementById('filter-comarca');
        const edificiSelect = document.getElementById('filter-edifici');
        const clearBtn = document.getElementById('filter-clear');
        const currentLabel = document.getElementById('omap-filters-current');

        const currentComarca = params.get('comarca') || '';
        const currentEdificiId = params.get('edificiId') || '';

        currentLabel.textContent = currentComarca
            ? ('Filtrant: ' + currentComarca + (currentEdificiId ? ' · edifici #' + currentEdificiId : ''))
            : '';

        function navigateTo(comarca, edificiId) {
            const url = new URL(window.location.href);
            url.search = '';
            if (comarca) url.searchParams.set('comarca', comarca);
            if (edificiId) url.searchParams.set('edificiId', edificiId);
            window.location.href = url.toString();
        }

        function fillEdificiOptions(buildings) {
            edificiSelect.innerHTML = '';
            const optAll = document.createElement('option');
            optAll.value = '';
            optAll.textContent = '— Totes les edificacions de la comarca —';
            edificiSelect.appendChild(optAll);

            buildings
                .slice()
                .sort((a, b) => a.title.localeCompare(b.title))
                .forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.title + (b.municipi ? ' (' + b.municipi + ')' : '');
                    if (String(b.id) === currentEdificiId) opt.selected = true;
                    edificiSelect.appendChild(opt);
                });

            edificiSelect.disabled = buildings.length === 0;
        }

        fetch('js/catalunya-markers.json')
            .then(r => r.json())
            .then(markers => {
                const byComarca = markers.reduce((acc, m) => {
                    const key = m.comarca || '';
                    if (!key) return acc;
                    (acc[key] = acc[key] || []).push(m);
                    return acc;
                }, {});

                Object.keys(byComarca).sort().forEach(comarca => {
                    const opt = document.createElement('option');
                    opt.value = comarca;
                    opt.textContent = comarca + ' (' + byComarca[comarca].length + ')';
                    if (comarca === currentComarca) opt.selected = true;
                    comarcaSelect.appendChild(opt);
                });

                if (currentComarca && byComarca[currentComarca]) {
                    fillEdificiOptions(byComarca[currentComarca]);
                }

                comarcaSelect.addEventListener('change', () => {
                    const comarca = comarcaSelect.value;
                    if (!comarca) {
                        navigateTo('', '');
                        return;
                    }
                    navigateTo(comarca, '');
                });

                edificiSelect.addEventListener('change', () => {
                    navigateTo(comarcaSelect.value, edificiSelect.value);
                });
            });

        clearBtn.addEventListener('click', () => navigateTo('', ''));
    })();
</script>

</body>
</html>
