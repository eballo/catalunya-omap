<!DOCTYPE html>
<html lang="ca">

<head>
    <title>Mapa Interactiu de Catalunya Medieval - Demo V2.31</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta content="Mapa interactiu d'edificacions medievals de Catalunya amb OpenStreetMaps i leafletjs" name="description">
    <meta content="Enric Ballo" name="author">
    <link href="favicon.png" rel="shortcut icon"/>

    <!-- facebook tags -->
    <meta content="assets/images/CM.png" property="og:image"/>
    <meta content="auto" property="og:image:width"/>
    <meta content="Mapa interactiu d'edificacions medievals de Catalunya." property="og:description"/>
    <meta content="https://demo.catalunyamedieval.es/omap10/" property="og:url"/>
    <meta content="Mapa Interactiu de Catalunya Medieval" property="og:title"/>

    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Droid+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link href="css/catalunya-omap.css" rel="stylesheet" type="text/css">

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            window.catalunyaOmapConfig = window.catalunyaOmapConfig || {};
            window.catalunyaOmapConfig.comarquesJsonUrl = 'js/catalunya-comarques-limits.json';
            // Feature buttons (bar under the filters): their state lives in the URL, so a configuration
            // can be shared as a link. Only what differs from the defaults is written (?locateButton=0).
            const DEFAULTS = {locateButton: true, foldLayers: true, searchButton: true, userPosition: false, darkMode: false};
            const state = {};
            Object.keys(DEFAULTS).forEach(function (name) {
                state[name] = params.has(name) ? params.get(name) === '1' : DEFAULTS[name];
            });
            Object.assign(window.catalunyaOmapConfig, {
                locateButton: state.locateButton,
                foldLayers: state.foldLayers,
                searchButton: state.searchButton,
                userPosition: state.userPosition
            });
            if (state.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
            window.cmDemoOptions = {defaults: DEFAULTS, state: state};

            const comarca = params.get('comarca');
            const municipi = params.get('municipi');
            const edificiId = params.get('edificiId');
            if (comarca) window.catalunyaOmapConfig.comarca = comarca;
            if (municipi) window.catalunyaOmapConfig.municipi = municipi;
            if (edificiId) window.catalunyaOmapConfig.edificiId = edificiId;
        })();
    </script>

    <style>
        /* Demo-only: feature buttons bar, same look as the filters bar. */
        body.omap-page #demo-options { flex-shrink: 0; }
        #demo-options {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            padding: 6px 24px;
            background: var(--cm-omap-chrome-alt);
            border-bottom: 1px solid var(--cm-omap-gold);
        }
        #demo-options .demo-options__title {
            font-size: 9.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--cm-omap-chrome-label, var(--cm-omap-gold-soft));
        }
        #demo-options .demo-option {
            padding: 5px 12px;
            font-family: 'Droid Serif', Georgia, serif;
            font-size: 11.5px;
            color: var(--cm-omap-gold-soft);
            background: transparent;
            border: 1px solid var(--cm-omap-gold);
            border-radius: 14px;
            cursor: pointer;
        }
        #demo-options .demo-option:hover { background: rgba(var(--cm-omap-gold-rgb), 0.15); }
        #demo-options .demo-option[aria-pressed="true"] {
            color: var(--cm-omap-chrome);
            background: var(--cm-omap-gold);
        }
        #demo-options .demo-options__reset {
            font-size: 11.5px;
            color: var(--cm-omap-gold);
        }
    </style>
</head>

<body class="omap-page">

<header id="site-header">
    <div class="header-inner">
        <div class="header-left">
            <h1 id="title-h1">Catalunya Medieval &middot; Demo v2.31</h1>
            <p id="title-h4">Mapa interactiu d'edificacions medievals &middot;
                <a href="https://www.catalunyamedieval.es/" target="_blank" title="Catalunya Medieval">www.catalunyamedieval.es</a>
            </p>
        </div>
        <div class="header-right">
            <a href="https://www.catalunyamedieval.es/" target="_blank" class="header-logo-link" title="Catalunya Medieval">
                <img src="images/logo/logoCM-red-mini.png" alt="Catalunya Medieval" class="header-logo">
            </a>
        </div>
    </div>
</header>

<div id="omap-filters">
    <label>
        Comarca
        <select id="filter-comarca">
            <option value="">— Totes les comarques —</option>
        </select>
    </label>
    <label>
        Població
        <select id="filter-poblacio" disabled>
            <option value="">— Selecciona una comarca primer —</option>
        </select>
    </label>
    <label>
        Edificació
        <select id="filter-edifici" disabled>
            <option value="">— Selecciona una comarca primer —</option>
        </select>
    </label>
    <button id="filter-clear" type="button">Netejar filtres</button>
    <span id="omap-filters-current"></span>
</div>

<div id="demo-options" role="group" aria-label="Funcionalitats del mapa">
    <span class="demo-options__title">Funcionalitats</span>
    <button type="button" class="demo-option" data-option="locateButton" aria-pressed="false"
            title="Botó «Localitza'm»: centra el mapa on ets (demana la posició només en prémer-lo)">Localitza'm
    </button>
    <button type="button" class="demo-option" data-option="foldLayers" aria-pressed="false"
            title="Plega els botons de categoria darrere d'un botó «Capes»">Capes plegables
    </button>
    <button type="button" class="demo-option" data-option="searchButton" aria-pressed="false"
            title="Lupa que obre la llista lateral amb el cursor al cercador">Cerca
    </button>
    <button type="button" class="demo-option" data-option="userPosition" aria-pressed="false"
            title="Botó «Ruta» a les fitxes: indicacions fins a l'edificació">Botó «Ruta»
    </button>
    <button type="button" class="demo-option" data-option="darkMode" aria-pressed="false"
            title="El mapa segueix el tema fosc de la pàgina">Mode fosc
    </button>
    <a class="demo-options__reset" href="?">Restableix</a>
</div>

<div id="container">

    <div id="omap"></div>

    <div id="secondaryDiv" style="display:none;">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="search-list" placeholder="Cercar monument…" type="search" autocomplete="off">
        </div>
        <div id="list">
            <ul id="map-list"></ul>
        </div>
    </div>

</div>

<script src="js/jquery-3.2.1.min.js" type="text/javascript"></script>
<script src="js/bootstrap.min.js" type="text/javascript"></script>
<script src="js/catalunya-omap.min.js" type="text/javascript"></script>

<script>
    (function () {
        const options = window.cmDemoOptions;
        document.querySelectorAll('#demo-options .demo-option').forEach(function (btn) {
            const name = btn.dataset.option;
            btn.setAttribute('aria-pressed', String(options.state[name]));
            btn.addEventListener('click', function () {
                const next = Object.assign({}, options.state);
                next[name] = !next[name];
                const query = new URLSearchParams(window.location.search);
                Object.keys(options.defaults).forEach(function (option) {
                    query.delete(option);
                    if (next[option] !== options.defaults[option]) query.set(option, next[option] ? '1' : '0');
                });
                window.location.search = query.toString();
            });
        });
    })();
</script>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const comarcaSelect = document.getElementById('filter-comarca');
        const poblacioSelect = document.getElementById('filter-poblacio');
        const edificiSelect = document.getElementById('filter-edifici');
        const clearBtn = document.getElementById('filter-clear');
        const currentLabel = document.getElementById('omap-filters-current');

        const currentComarca = params.get('comarca') || '';
        const currentMunicipi = params.get('municipi') || '';
        const currentEdificiId = params.get('edificiId') || '';

        currentLabel.textContent = currentComarca
            ? ('Filtrant: ' + currentComarca
                + (currentMunicipi ? ' · ' + currentMunicipi : '')
                + (currentEdificiId ? ' · edifici #' + currentEdificiId : ''))
            : '';

        function navigateTo(comarca, municipi, edificiId) {
            const url = new URL(window.location.href);
            url.search = '';
            Object.keys(window.cmDemoOptions.defaults).forEach(function (option) {
                if (params.has(option)) url.searchParams.set(option, params.get(option));
            });
            if (comarca) url.searchParams.set('comarca', comarca);
            if (municipi) url.searchParams.set('municipi', municipi);
            if (edificiId) url.searchParams.set('edificiId', edificiId);
            window.location.href = url.toString();
        }

        function fillEdificiOptions(buildings) {
            edificiSelect.innerHTML = '';
            const optAll = document.createElement('option');
            optAll.value = '';
            optAll.textContent = '— Totes les edificacions —';
            edificiSelect.appendChild(optAll);

            buildings
                .slice()
                .sort((a, b) => a.title.localeCompare(b.title))
                .forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.title + (b.municipi ? ' (' + b.municipi + ')' : '');
                    if (String(b.id) === currentEdificiId) opt.selected = true;
                    edificiSelect.appendChild(opt);
                });

            edificiSelect.disabled = buildings.length === 0;
        }

        function groupBy(list, field) {
            return list.reduce((acc, m) => {
                const key = m[field] || '';
                if (!key) return acc;
                (acc[key] = acc[key] || []).push(m);
                return acc;
            }, {});
        }

        function fillPoblacioOptions(comarcaMarkers) {
            poblacioSelect.innerHTML = '';
            const optAll = document.createElement('option');
            optAll.value = '';
            optAll.textContent = '— Totes les poblacions de la comarca —';
            poblacioSelect.appendChild(optAll);

            const byMunicipi = groupBy(comarcaMarkers, 'municipi');
            Object.keys(byMunicipi).sort().forEach(municipi => {
                const opt = document.createElement('option');
                opt.value = municipi;
                opt.textContent = municipi + ' (' + byMunicipi[municipi].length + ')';
                if (municipi === currentMunicipi) opt.selected = true;
                poblacioSelect.appendChild(opt);
            });

            poblacioSelect.disabled = false;
            return byMunicipi;
        }

        fetch('js/catalunya-markers.json')
            .then(r => r.json())
            .then(markers => {
                const byComarca = groupBy(markers, 'comarca');

                Object.keys(byComarca).sort().forEach(comarca => {
                    const opt = document.createElement('option');
                    opt.value = comarca;
                    opt.textContent = comarca + ' (' + byComarca[comarca].length + ')';
                    if (comarca === currentComarca) opt.selected = true;
                    comarcaSelect.appendChild(opt);
                });

                let byMunicipi = {};
                if (currentComarca && byComarca[currentComarca]) {
                    byMunicipi = fillPoblacioOptions(byComarca[currentComarca]);
                    const scoped = currentMunicipi && byMunicipi[currentMunicipi]
                        ? byMunicipi[currentMunicipi]
                        : byComarca[currentComarca];
                    fillEdificiOptions(scoped);
                }

                comarcaSelect.addEventListener('change', () => {
                    navigateTo(comarcaSelect.value, '', '');
                });

                poblacioSelect.addEventListener('change', () => {
                    navigateTo(comarcaSelect.value, poblacioSelect.value, '');
                });

                edificiSelect.addEventListener('change', () => {
                    navigateTo(comarcaSelect.value, poblacioSelect.value, edificiSelect.value);
                });
            });

        clearBtn.addEventListener('click', () => navigateTo('', '', ''));
    })();
</script>

</body>
</html>
