<!DOCTYPE html>
<html lang="ca">

<head>
    <title>Catalunya OMap — Pàgina de proves</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link href="css/catalunya-omap.css" rel="stylesheet" type="text/css">

    <style>
        #test-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            background: #222;
            font-family: sans-serif;
            font-size: 14px;
        }
        #test-filters label {
            color: #eee;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        #test-filters select {
            min-width: 220px;
            padding: 4px 6px;
        }
        #test-filters button {
            padding: 5px 12px;
            cursor: pointer;
            align-self: flex-end;
        }
        #test-filters .current {
            color: #9ecbff;
            margin-left: auto;
            align-self: center;
        }
        #omap {
            height: calc(100vh - 62px);
        }
    </style>

    <script>
        const params = new URLSearchParams(window.location.search);
        window.catalunyaOmapConfig = {
            markersJsonUrl: 'js/catalunya-markers.json',
            serverHost: 'http://localhost:9090/'
        };
        if (params.get('comarca')) window.catalunyaOmapConfig.comarca = params.get('comarca');
        if (params.get('edificiId')) window.catalunyaOmapConfig.edificiId = params.get('edificiId');
    </script>
</head>

<body>

<div id="test-filters">
    <label>
        Comarca
        <select id="filter-comarca">
            <option value="">— Totes les comarques —</option>
        </select>
    </label>
    <label>
        Edificació
        <select id="filter-edifici" disabled>
            <option value="">— Selecciona una comarca primer —</option>
        </select>
    </label>
    <button id="filter-clear" type="button">Netejar filtres</button>
    <span class="current" id="filter-current"></span>
</div>

<div id="container">
    <div id="omap"></div>
    <div id="secondaryDiv" style="display:none;">
        <div id="list"><ul id="map-list"></ul></div>
    </div>
</div>

<script src="js/jquery-3.2.1.min.js" type="text/javascript"></script>
<script src="js/catalunya-omap.min.js" type="text/javascript"></script>

<script>
    (function () {
        const comarcaSelect = document.getElementById('filter-comarca');
        const edificiSelect = document.getElementById('filter-edifici');
        const clearBtn = document.getElementById('filter-clear');
        const currentLabel = document.getElementById('filter-current');

        const currentComarca = params.get('comarca') || '';
        const currentEdificiId = params.get('edificiId') || '';

        currentLabel.textContent = currentComarca
            ? ('Filtrant: ' + currentComarca + (currentEdificiId ? ' · edifici #' + currentEdificiId : ''))
            : 'Sense filtre (totes les edificacions)';

        function navigateTo(comarca, edificiId) {
            const url = new URL(window.location.href);
            url.search = '';
            if (comarca) url.searchParams.set('comarca', comarca);
            if (edificiId) url.searchParams.set('edificiId', edificiId);
            window.location.href = url.toString();
        }

        function fillEdificiOptions(buildings) {
            edificiSelect.innerHTML = '';
            const optAll = document.createElement('option');
            optAll.value = '';
            optAll.textContent = '— Totes les edificacions de la comarca —';
            edificiSelect.appendChild(optAll);

            buildings
                .slice()
                .sort((a, b) => a.title.localeCompare(b.title))
                .forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.title + (b.municipi ? ' (' + b.municipi + ')' : '');
                    if (String(b.id) === currentEdificiId) opt.selected = true;
                    edificiSelect.appendChild(opt);
                });

            edificiSelect.disabled = buildings.length === 0;
        }

        fetch('js/catalunya-markers.json')
            .then(r => r.json())
            .then(markers => {
                const byComarca = markers.reduce((acc, m) => {
                    const key = m.comarca || '';
                    if (!key) return acc;
                    (acc[key] = acc[key] || []).push(m);
                    return acc;
                }, {});

                Object.keys(byComarca).sort().forEach(comarca => {
                    const opt = document.createElement('option');
                    opt.value = comarca;
                    opt.textContent = comarca + ' (' + byComarca[comarca].length + ')';
                    if (comarca === currentComarca) opt.selected = true;
                    comarcaSelect.appendChild(opt);
                });

                if (currentComarca && byComarca[currentComarca]) {
                    fillEdificiOptions(byComarca[currentComarca]);
                }

                comarcaSelect.addEventListener('change', () => {
                    const comarca = comarcaSelect.value;
                    if (!comarca) {
                        navigateTo('', '');
                        return;
                    }
                    navigateTo(comarca, '');
                });

                edificiSelect.addEventListener('change', () => {
                    navigateTo(comarcaSelect.value, edificiSelect.value);
                });
            });

        clearBtn.addEventListener('click', () => navigateTo('', ''));
    })();
</script>

</body>
</html>
